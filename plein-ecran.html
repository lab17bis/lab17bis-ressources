<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ressources du Lab 17 bis</title>
<style>html,body{height:100%;margin:0}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="f" title="Ressources du Lab 17 bis" allow="clipboard-write; fullscreen" src="about:blank"></iframe>
<script>
// L’adresse du catalogue Grist (mode intégré) est lue dans le paramètre ?u=
// ou dans la constante ci-dessous une fois le partage public activé.
var URL_GRIST = '';
var p = new URLSearchParams(location.search).get('u') || URL_GRIST;
if (/^https:\/\/grist\.numerique\.gouv\.fr\//.test(p)) document.getElementById('f').src = p;
else document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">Adresse du catalogue non configurée.</p>';
</script>
</body>
</html>
